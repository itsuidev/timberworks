<!DOCTYPE html>
<html lang="en">
<head>
    <title>Timberworks - Checkout</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
    <link rel="icon" type="image/png" href="assets/img/favicon.png"/>
    
    <link rel="stylesheet" type="text/css" href="assets/css/style.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    
    <style>
        .checkout-container { padding-top: 120px; padding-bottom: 60px; }
        .order-summary { background: #f8f9fa; border-radius: 12px; padding: 25px; }
        .product-img-checkout { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }
        .form-control:focus { border-color: #ba9464; box-shadow: 0 0 0 0.25rem rgba(186, 148, 100, 0.25); }
    </style>
</head>
<body data-page="checkout">
    <div id="overlay" class="position-fixed top-0 pe-none h-100 w-100 z-3 color-background-dark"></div>
    <nav id="main-nav" class="main-nav-alt navbar navbar-expand-lg navbar-dark fixed-top z-2 custom-transition"></nav>

    <div class="container checkout-container mt-5">
        <div class="row g-5">
            <div class="col-lg-7">
                <h4 class="mb-4 fw-bold">Shipping Information</h4>
                <form id="checkout-form" class="needs-validation" novalidate>
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstName" placeholder="Full first name" required>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lastName" placeholder="Full last name" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="Enter email" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Address</label>
                            <input type="text" class="form-control" id="address" placeholder="Enter your address" required>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">City</label>
                            <input type="text" class="form-control" id="city" placeholder="Enter city name" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Zip Code</label>
                            <input type="text" class="form-control" id="zip" placeholder="Enter zipcode" required>
                        </div>
                    </div>

                    <hr class="my-4">

                    <h4 class="mb-3 fw-bold">Payment</h4>
                    <div class="my-3">
                        <div class="form-check">
                            <input id="credit" name="paymentMethod" type="radio" class="form-check-input" checked required>
                            <label class="form-check-label color-text-dark" for="credit">Credit Card</label>
                        </div>
                        <div class="form-check">
                            <input id="cash" name="paymentMethod" type="radio" class="form-check-input" required>
                            <label class="form-check-label color-text-dark" for="cash">Cash on Delivery</label>
                        </div>
                    </div>

                    <button class="w-100 btn btn-dark btn-lg mt-4 py-3 fw-bold" type="submit">COMPLETE PURCHASE</button>
                </form>
            </div>

            <div class="col-lg-5">
                <div class="order-summary shadow-sm">
                    <h4 class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-dark fw-bold">Your Order</span>
                        <span class="badge bg-dark rounded-pill" id="checkout-cart-count">0</span>
                    </h4>
                    <ul class="list-group list-group-flush mb-3" id="checkout-items-list">
                        </ul>

                    <div class="list-group-item d-flex justify-content-between align-items-center border-top pt-3 mt-2">
                        <span class="fs-5 fw-bold color-text-dark">Total (USD)</span>
                        <strong class="fs-4 text-success" id="checkout-total-price">$0.00</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script type="text/javascript" src="assets/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
